name: Site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test developer interactions
        run: node --test --test-isolation=none header.test.cjs overview.test.cjs tests/examples.test.cjs
      - name: Validate pages, links, assets, and metadata
        run: node check-site.mjs
